name: Manual macOS E2E

on:
  workflow_dispatch:

jobs:
  real-defaults:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/mdefaults" ./cmd/mdefaults
      - name: Run isolated real-defaults smoke test
        env:
          MDEFAULTS_RUN_REAL_DEFAULTS_SMOKE: "1"
          MDEFAULTS_REAL_BINARY: ${{ runner.temp }}/mdefaults
        run: go test -tags=realdefaults -count=1 -v ./test/macos
