name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests with race detection
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce unit coverage
        run: ./scripts/check_coverage.sh coverage.out 95.0
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.1
      - name: Run golangci-lint
        run: golangci-lint run

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build E2E image
        run: docker build -f test/e2e/Dockerfile -t mdefaults-e2e:ci .
      - name: Run isolated E2E suite
        run: >-
          docker run --rm
          --network none
          --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          --cap-drop ALL
          --security-opt no-new-privileges
          mdefaults-e2e:ci

  macos-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/mdefaults" ./cmd/mdefaults
      - name: Run real defaults smoke test
        env:
          MDEFAULTS_RUN_REAL_DEFAULTS_SMOKE: "1"
          MDEFAULTS_REAL_BINARY: ${{ runner.temp }}/mdefaults
        run: go test -tags=realdefaults -count=1 -v ./test/macos
